<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code source · Horloge & minuteur</title>
  <style>
    :root { color-scheme:dark; --bg:#0b1020; --panel:#121a30; --line:#ffffff1a; --text:#f4f7ff; --muted:#a9b5d0; --accent:#8b9cff; }
    * { box-sizing:border-box; }
    body { margin:0; padding:32px 18px; color:var(--text); background:var(--bg); font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
    main { width:min(1100px,100%); margin:auto; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px; font-family:system-ui,sans-serif; }
    h1 { margin:0; font-size:1.45rem; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    pre { overflow:auto; padding:24px; border:1px solid var(--line); border-radius:16px; background:var(--panel); color:#dce5ff; line-height:1.55; font-size:.83rem; tab-size:2; white-space:pre; }
    .status { color:var(--muted); font: .85rem system-ui,sans-serif; }
  </style>
</head>
<body>
  <main>
    <header><h1>Code source — Horloge & minuteur</h1><a href="index.html">← Retour au résultat</a></header>
    <p class="status" id="status">Chargement du code…</p>
    <pre><code id="source"></code></pre>
  </main>
  <script>
    fetch('index.html').then(response => {
      if (!response.ok) throw new Error('Impossible de charger index.html');
      return response.text();
    }).then(source => {
      document.querySelector('#source').textContent = source;
      document.querySelector('#status').textContent = 'Source de index.html';
    }).catch(() => {
      document.querySelector('#status').textContent = 'Le code source est également disponible dans index.html sur GitHub.';
    });
  </script>
</body>
</html>
